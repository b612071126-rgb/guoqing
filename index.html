<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>国庆 1 分钟动画 · 1949—2026</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#000;overflow:hidden;
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#eee}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  #stage{position:relative;width:100%;max-width:calc(100vh * 16 / 9);aspect-ratio:16/9;background:#000;
    box-shadow:0 0 80px rgba(180,30,30,.35)}
  canvas{display:block;width:100%;height:100%}
  #ui{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;text-align:center;padding:24px;
    background:radial-gradient(circle at 50% 42%,rgba(150,25,25,.5),rgba(0,0,0,.94));
    transition:opacity .45s}
  #ui.hide{opacity:0;pointer-events:none}
  h1{margin:0;font-size:clamp(20px,3.2vw,42px);letter-spacing:.22em;
    background:linear-gradient(180deg,#fff3c8,#e0a83c);-webkit-background-clip:text;
    background-clip:text;color:transparent;text-shadow:0 0 40px rgba(255,180,60,.25)}
  .tip{margin:0;opacity:.68;font-size:clamp(12px,1.15vw,15px);letter-spacing:.1em;line-height:1.9}
  .btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:10px}
  button,a.btn{padding:12px 26px;border-radius:999px;border:1px solid rgba(255,220,140,.45);
    background:linear-gradient(180deg,rgba(196,32,32,.92),rgba(118,10,10,.92));
    color:#ffe9a8;font-size:clamp(13px,1.25vw,16px);letter-spacing:.12em;cursor:pointer;
    text-decoration:none;display:none;transition:.25s}
  button{display:inline-block}
  button:hover,a.btn:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(210,45,45,.45)}
  button.ghost{background:transparent;color:#ffd98a}
  #status{position:absolute;left:0;right:0;bottom:16px;text-align:center;font-size:13px;
    letter-spacing:.18em;color:#ffd98a;opacity:.85;pointer-events:none}
  #bar{position:absolute;left:0;bottom:0;height:3px;width:0%;
    background:linear-gradient(90deg,#ff5a3c,#ffd166);
    box-shadow:0 0 14px rgba(255,150,80,.9);transition:width .15s linear}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="c" width="1920" height="1080"></canvas>

    <div id="ui">
      <h1>国 庆 献 礼</h1>
      <p class="tip">
        60 秒 Canvas 动画 · 全程代码生成<br>
        录制需约 1 分钟，请保持页面在前台
      </p>
      <div class="btns">
        <button id="btnPlay" class="ghost">▶ 仅预览</button>
        <button id="btnRec">● 播放并录制</button>
        <a id="dl" class="btn" download="guoqing.webm">⬇ 下载视频</a>
      </div>
    </div>

    <div id="status"></div>
    <div id="bar"></div>
  </div>
</div>

<script>
/* =====================================================================
   国庆 1 分钟动画 · 单文件 Canvas 实现
   ===================================================================== */

const W = 1920, H = 1080;
const TOTAL = 60;                 // 视频总时长（秒）
const YEAR_FROM = 1949;
const YEAR_TO   = 2026;           // 改这里可以换年份
const ANNIV     = YEAR_TO - YEAR_FROM;  // 周年数

const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d', { alpha: false });

/* ---------- 工具 ---------- */
const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
const lerp  = (a, b, p) => a + (b - a) * p;
const rand  = (a, b) => a + Math.random() * (b - a);
const easeOutCubic   = p => 1 - Math.pow(1 - p, 3);
const easeInOutCubic = p => p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;

/** 时间轴包络：在 [a,b] 淡入，[c,d] 淡出 */
function fade(t, a, b, c, d) {
  let o = 1;
  if (b > a) o *= clamp((t - a) / (b - a));
  if (d > c) o *= 1 - clamp((t - c) / (d - c));
  return clamp(o);
}

function hex2rgb(h) {
  h = h.replace('#', '');
  return [parseInt(h.substr(0, 2), 16), parseInt(h.substr(2, 2), 16), parseInt(h.substr(4, 2), 16)];
}
function mix(c1, c2, p) {
  const A = hex2rgb(c1), B = hex2rgb(c2);
  return `rgb(${Math.round(lerp(A[0], B[0], p))},${Math.round(lerp(A[1], B[1], p))},${Math.round(lerp(A[2], B[2], p))})`;
}

/* ---------- 天空关键帧 ---------- */
const SKY = [
  [0,  '#04060f', '#0b1428'],
  [8,  '#070611', '#1a0d20'],
  [16, '#1b0810', '#5c1a1e'],
  [24, '#0d0512', '#2a0a16'],
  [34, '#06040d', '#160717'],
  [46, '#05040c', '#1a0714'],
  [52, '#0a0410', '#3d0d1c'],
  [60, '#0a0410', '#3d0d1c'],
];
function skyColors(t) {
  if (t <= SKY[0][0]) return [SKY[0][1], SKY[0][2]];
  for (let i = 0; i < SKY.length - 1; i++) {
    const a = SKY[i], b = SKY[i + 1];
    if (t >= a[0] && t <= b[0]) {
      const p = clamp((t - a[0]) / (b[0] - a[0]));
      return [mix(a[1], b[1], p), mix(a[2], b[2], p)];
    }
  }
  const L = SKY[SKY.length - 1];
  return [L[1], L[2]];
}

/* ---------- 星空 ---------- */
const bgStars = Array.from({ length: 220 }, () => ({
  x: Math.random() * W,
  y: Math.random() * H * 0.82,
  r: rand(0.6, 1.9),
  ph: Math.random() * Math.PI * 2,
  sp: rand(0.6, 1.9),
}));

function drawStars(t, alpha) {
  if (alpha <= 0.01) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = '#cfe4ff';
  for (const s of bgStars) {
    const tw = 0.4 + 0.6 * Math.sin(t * s.sp + s.ph);
    ctx.globalAlpha = alpha * tw * 0.9;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

/* ---------- 背景 ---------- */
function drawBackground(t) {
  const [top, bot] = skyColors(t);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, top);
  g.addColorStop(1, bot);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // 地平线暖光
  const p = clamp((t - 8) / 16) * clamp(1 - (t - 34) / 20);
  if (p > 0.01) {
    const gg = ctx.createRadialGradient(W / 2, H * 1.06, 0, W / 2, H * 1.06, H * 0.95);
    gg.addColorStop(0, `rgba(255,145,60,${0.30 * p})`);
    gg.addColorStop(0.5, `rgba(180,40,30,${0.12 * p})`);
    gg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gg;
    ctx.fillRect(0, 0, W, H);
  }
}

/* =====================================================================
   场景 A：粒子汇聚成 "1949 — 2026"
   ===================================================================== */
let constellation = null;

function buildConstellation() {
  const off = document.createElement('canvas');
  off.width = W; off.height = H;
  const o = off.getContext('2d');
  o.fillStyle = '#fff';
  o.textAlign = 'center';
  o.textBaseline = 'middle';
  o.font = 'bold 170px "PingFang SC","Microsoft YaHei",sans-serif';
  o.fillText(`${YEAR_FROM} — ${YEAR_TO}`, W / 2, H / 2);

  const data = o.getImageData(0, 0, W, H).data;
  const pts = [];
  const gap = 7;
  for (let y = 0; y < H; y += gap)
    for (let x = 0; x < W; x += gap)
      if (data[(y * W + x) * 4 + 3] > 128) pts.push([x, y]);

  // 采样到 ~1400 个目标点
  let picked = pts;
  if (pts.length > 1400) {
    const idx = new Set();
    while (idx.size < 1400) idx.add(Math.floor(Math.random() * pts.length));
    picked = [...idx].map(i => pts[i]);
  }

  return picked.map(([tx, ty]) => {
    const ang = Math.random() * Math.PI * 2;
    const dist = rand(520, 1500);
    return {
      sx: W / 2 + Math.cos(ang) * dist,
      sy: H / 2 + Math.sin(ang) * dist * 0.72,
      tx, ty,
      delay: Math.random() * 1.6,
      dur: rand(1.6, 2.9),
      size: rand(1.2, 2.9),
      hue: rand(38, 54),
    };
  });
}

function drawConstellation(t, alpha) {
  if (!constellation) constellation = buildConstellation();
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';

  const settled = clamp((t - 4.2) / 1.4);
  for (const p of constellation) {
    const prog = clamp((t - 0.5 - p.delay) / p.dur);
    const e = easeOutCubic(prog);
    const x = lerp(p.sx, p.tx, e);
    const y = lerp(p.sy, p.ty, e);
    const tw = 1 + Math.sin(t * 3 + p.delay * 9) * 0.28 * settled;
    ctx.globalAlpha = alpha * (0.28 + 0.72 * prog) * tw;
    ctx.fillStyle = `hsl(${p.hue},100%,${62 + 12 * Math.sin(t * 2 + p.delay * 7)}%)`;
    ctx.beginPath();
    ctx.arc(x, y, p.size * (0.5 + 0.7 * e), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

/* =====================================================================
   场景 B：升国旗
   ===================================================================== */
function drawStar(cx, cy, R, rot) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const r = i % 2 === 0 ? R : R * 0.382;
    const a = -Math.PI / 2 + i * Math.PI / 5 + rot;
    const x = cx + Math.cos(a) * r;
    const y = cy + Math.sin(a) * r;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fill();
}

function drawFlag(x0, y0, w, h, time, amp) {
  const N = 64;
  const wave = u => Math.sin(u * 4.2 - time * 2.2) * amp * Math.pow(u, 1.25);

  // 旗面（分条模拟飘动）
  for (let i = 0; i < N; i++) {
    const u0 = i / N, u1 = (i + 1) / N;
    const xa = x0 + u0 * w, xb = x0 + u1 * w;
    const ya = y0 + wave(u0), yb = y0 + wave(u1);
    const k = (Math.sin(u0 * 4.2 - time * 2.2) + 1) / 2;
    ctx.fillStyle = `rgb(222,${Math.round(28 + 46 * k)},${Math.round(12 + 34 * k)})`;
    ctx.beginPath();
    ctx.moveTo(xa, ya);
    ctx.lineTo(xb, yb);
    ctx.lineTo(xb, yb + h);
    ctx.lineTo(xa, ya + h);
    ctx.closePath();
    ctx.fill();
  }

  // 五星
  const P = (u, v) => [x0 + u * w, y0 + wave(u) + v * h];
  const bigR = h * 0.155, smallR = h * 0.056;
  const [bx, by] = P(0.167, 0.25);
  ctx.fillStyle = '#ffde00';
  drawStar(bx, by, bigR, 0);

  const smalls = [[0.333, 0.10], [0.400, 0.20], [0.400, 0.35], [0.333, 0.45]];
  for (const [u, v] of smalls) {
    const [sx, sy] = P(u, v);
    const rot = Math.atan2(by - sy, bx - sx) + Math.PI / 2;
    drawStar(sx, sy, smallR, rot);
  }
}

function drawFlagScene(tl, alpha) {
  const poleX = W * 0.42;
  const poleTop = 150;

  ctx.save();
  ctx.globalAlpha = alpha;

  // 旗杆
  const pg = ctx.createLinearGradient(poleX - 8, 0, poleX + 8, 0);
  pg.addColorStop(0, '#6d727a');
  pg.addColorStop(0.35, '#eef2f7');
  pg.addColorStop(0.62, '#b9bfc7');
  pg.addColorStop(1, '#5a5f66');
  ctx.fillStyle = pg;
  ctx.fillRect(poleX - 7, poleTop, 14, H + 60 - poleTop);

  // 杆顶金球
  ctx.beginPath();
  ctx.arc(poleX, poleTop - 6, 15, 0, Math.PI * 2);
  ctx.fillStyle = '#ffd76a';
  ctx.fill();

  // 升旗
  const rp = easeInOutCubic(clamp((tl - 0.5) / 5.5));
  const fw = 520, fh = 347;
  const y = lerp(H + 40 - fh, poleTop + 34, rp);
  drawFlag(poleX + 7, y, fw, fh, tl, 24);

  ctx.restore();
}

/* =====================================================================
   场景 C：城市剪影 + 灯笼
   ===================================================================== */
const buildings = [];
function buildCity() {
  buildings.length = 0;
  let x = -120;
  while (x < W + 120) {
    const bw = rand(70, 180);
    const bh = rand(140, 470);
    const wins = [];
    for (let wy = 24; wy < bh - 30; wy += 26)
      for (let wx = 14; wx < bw - 22; wx += 24)
        if (Math.random() < 0.4) wins.push([wx, wy]);
    buildings.push({ x, w: bw, h: bh, wins, seed: Math.random() * 100 });
    x += bw + rand(4, 20);
  }
}

function drawCity(tl, alpha) {
  if (!buildings.length) buildCity();
  ctx.save();
  ctx.globalAlpha = alpha;
  const baseY = H + 10;

  ctx.fillStyle = '#07030e';
  for (const b of buildings) ctx.fillRect(b.x, baseY - b.h, b.w, b.h + 12);

  ctx.globalCompositeOperation = 'lighter';
  for (const b of buildings) {
    const y0 = baseY - b.h;
    for (const [wx, wy] of b.wins) {
      const fl = 0.5 + 0.5 * Math.sin(tl * 1.6 + b.seed + wx * 0.08 + wy * 0.05);
      ctx.fillStyle = `rgba(255,196,104,${0.5 * fl})`;
      ctx.fillRect(b.x + wx, y0 + wy, 9, 11);
    }
  }
  ctx.restore();
}

const lanterns = Array.from({ length: 9 }, () => ({
  x: rand(60, W - 60),
  y: rand(H * 0.35, H * 1.1),
  sp: rand(16, 40),
  r: rand(16, 30),
  ph: rand(0, 6.28),
}));

function drawLanterns(tl, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  for (const L of lanterns) {
    const span = H + 320;
    const y = ((L.y - tl * L.sp) % span + span) % span - 160;
    const x = L.x + Math.sin(tl * 1.2 + L.ph) * 18;

    ctx.save();
    ctx.translate(x, y);

    ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, L.r * 3.4);
    g.addColorStop(0, 'rgba(255,170,70,0.5)');
    g.addColorStop(1, 'rgba(255,80,30,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, L.r * 3.4, 0, Math.PI * 2); ctx.fill();

    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#e2381d';
    ctx.beginPath(); ctx.ellipse(0, 0, L.r * 0.78, L.r, 0, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#f2c14e';
    ctx.fillRect(-L.r * 0.42, -L.r - 5, L.r * 0.84, 6);
    ctx.fillRect(-L.r * 0.42, L.r - 1, L.r * 0.84, 6);

    ctx.strokeStyle = 'rgba(242,193,78,0.85)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, L.r + 5); ctx.lineTo(0, L.r + 20); ctx.stroke();

    ctx.restore();
  }
  ctx.restore();
}

/* =====================================================================
   烟花系统
   ===================================================================== */
const fwParticles = [];
const FW_HUES = [0, 12, 26, 40, 50, 348, 320, 190];
let nextFwAt = 19;

function spawnBurst(x, y, hue, count = 90, power = 1) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = rand(60, 330) * power;
    fwParticles.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      life: 1,
      decay: rand(0.5, 1.05),
      hue: hue + rand(-14, 14),
      size: rand(1.4, 3.4),
    });
  }
}

function updateFW(dt) {
  for (let i = fwParticles.length - 1; i >= 0; i--) {
    const p = fwParticles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 130 * dt;
    const drag = 1 - 1.15 * dt;
    p.vx *= drag; p.vy *= drag;
    p.life -= p.decay * dt;
    if (p.life <= 0) fwParticles.splice(i, 1);
  }
}

function drawFW() {
  if (!fwParticles.length) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const p of fwParticles) {
    const a = clamp(p.life);
    ctx.globalAlpha = a * a;
    ctx.fillStyle = `hsl(${p.hue},100%,${55 + 25 * a}%)`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * (0.4 + 0.7 * a), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function fireworksTick(t) {
  if (t > nextFwAt) {
    const active = (t > 19 && t < 31) || (t > 47 && t < 59.5);
    if (active) {
      const hue = FW_HUES[(Math.random() * FW_HUES.length) | 0];
      spawnBurst(rand(W * 0.1, W * 0.9), rand(H * 0.1, H * 0.5), hue, t > 47 ? 110 : 85, t > 47 ? 1.15 : 1);
      if (audioCtx && t < TOTAL - 1) boom(audioCtx.currentTime, t > 47 ? 0.09 : 0.06);
    }
    nextFwAt = t + (t > 47 ? rand(0.28, 0.62) : rand(0.65, 1.3));
  }
}

/* =====================================================================
   文字渲染
   ===================================================================== */
function drawTitle(text, t, alpha, opt = {}) {
  const {
    size = 140, y = H / 2,
    c1 = '#fff6d0', c2 = '#e6a63c',
    appear = 0.85,
    glow = 'rgba(255,170,60,0.85)',
  } = opt;

  const p = clamp(t / appear);
  if (p <= 0) return;
  const e = easeOutCubic(p);

  ctx.save();
  ctx.globalAlpha = alpha * e;
  ctx.translate(W / 2, y);
  const s = lerp(0.9, 1, e);
  ctx.scale(s, s);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = `bold ${size}px "PingFang SC","Microsoft YaHei",system-ui,sans-serif`;

  const g = ctx.createLinearGradient(0, -size * 0.55, 0, size * 0.55);
  g.addColorStop(0, c1);
  g.addColorStop(1, c2);

  ctx.shadowColor = glow;
  ctx.shadowBlur = size * 0.2;
  ctx.fillStyle = g;
  ctx.fillText(text, 0, 0);
  ctx.fillText(text, 0, 0);
  ctx.shadowBlur = 0;
  ctx.fillText(text, 0, 0);
  ctx.restore();
}

/* =====================================================================
   场景 E：金色光带
   ===================================================================== */
const ribbonParticles = Array.from({ length: 300 }, () => ({
  u: Math.random(),
  v: rand(-1, 1),
  sp: rand(0.05, 0.15),
  size: rand(1, 3.2),
  hue: rand(35, 55),
}));

function drawRibbon(tl, alpha) {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const cy = H * 0.5;
  for (const p of ribbonParticles) {
    const u = (p.u + tl * p.sp) % 1;
    const x = u * W * 1.2 - W * 0.1;
    const base = cy + Math.sin(u * Math.PI * 2.2 + tl * 0.9) * H * 0.17;
    const y = base + p.v * 95;
    const edge = Math.sin(u * Math.PI);
    ctx.globalAlpha = alpha * edge * (0.3 + 0.7 * Math.abs(p.v));
    ctx.fillStyle = `hsl(${p.hue},100%,70%)`;
    ctx.beginPath();
    ctx.arc(x, y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

/* =====================================================================
   镜头调度
   ===================================================================== */
let lastFrameTime = 0;
let frameDt = 0.016;

function render(t) {
  drawBackground(t);
  drawStars(t, clamp(1 - t / 24) * 0.85 + 0.12);

  fireworksTick(t);
  updateFW(frameDt);

  // A 粒子汇聚 0–9.6s
  const a = fade(t, 0.2, 1.4, 7.6, 9.6);
  if (a > 0.01) drawConstellation(t, a);

  // B 升旗 8.5–21s
  const b = fade(t, 8.5, 10.8, 19, 21.2);
  if (b > 0.01) drawFlagScene(t - 8.5, b);

  // C 城市 + 灯笼 19.5–32s
  const c = fade(t, 19.5, 22, 30, 32);
  if (c > 0.01) {
    drawCity(t, c);
    drawLanterns(t, c);
  }

  // 烟花层
  drawFW();

  // D 第一句文案 31–40.5s
  const d = fade(t, 31, 32.6, 38.5, 40.5);
  if (d > 0.01) {
    const tl = t - 31;
    drawTitle('山河锦绣  国泰民安', tl, d, { size: 158, y: H * 0.46 });
    if (tl > 0.9) {
      const p = clamp((tl - 0.9) / 1.0);
      ctx.save();
      ctx.globalAlpha = d * p;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = '34px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillStyle = 'rgba(255,225,170,0.72)';
      ctx.fillText(`${YEAR_FROM} — ${YEAR_TO}`, W / 2, H * 0.63);
      ctx.restore();
    }
  }

  // E 光带 + 第二句 40–49.5s
  const e = fade(t, 40, 41.6, 47.5, 49.5);
  if (e > 0.01) {
    const tl = t - 40;
    drawRibbon(tl, e);
    drawTitle('以吾辈之青春', tl, e, { size: 118, y: H * 0.43 });
    drawTitle('捍卫盛世之中华', tl - 0.55, e, { size: 118, y: H * 0.58 });
  }

  // F 终章 49.5–60s
  const f = fade(t, 49.5, 51.5, 60.5, 61);
  if (f > 0.01) {
    const tl = t - 49.5;
    drawTitle('热烈庆祝中华人民共和国成立', tl, f, {
      size: 62, y: H * 0.34, c1: '#ffeec0', c2: '#d99a33', glow: 'rgba(255,160,60,0.7)',
    });
    drawTitle(`${ANNIV} 周年`, tl - 0.4, f, {
      size: 185, y: H * 0.54, c1: '#fff9dd', c2: '#e2a334', glow: 'rgba(255,190,80,0.95)',
    });
    drawTitle(`${YEAR_FROM} — ${YEAR_TO}  ·  盛世华诞`, tl - 0.85, f, {
      size: 42, y: H * 0.76, c1: '#ffe7b0', c2: '#c8873a', glow: 'rgba(255,160,60,0.6)',
    });
  }

  drawOverlay();
}

/* ---------- 暗角 + 黑边 + 颗粒 ---------- */
let noisePattern = null;
function initNoise() {
  const nc = document.createElement('canvas');
  nc.width = nc.height = 200;
  const nx = nc.getContext('2d');
  const img = nx.createImageData(200, 200);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = (Math.random() * 255) | 0;
    img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
    img.data[i + 3] = 13;
  }
  nx.putImageData(img, 0, 0);
  noisePattern = ctx.createPattern(nc, 'repeat');
}

function drawOverlay() {
  // 暗角
  const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.34, W / 2, H / 2, H * 0.98);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,0.75)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // 电影黑边
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, 46);
  ctx.fillRect(0, H - 46, W, 46);

  // 颗粒
  if (!noisePattern) initNoise();
  if (noisePattern) {
    ctx.save();
    ctx.translate(rand(-120, 0), rand(-120, 0));
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = noisePattern;
    ctx.fillRect(0, 0, W + 140, H + 140);
    ctx.restore();
  }
}

/* =====================================================================
   音频（Web Audio 合成，无外部素材）
   ===================================================================== */
let audioCtx = null, masterGain = null, recDest = null;

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.0001;
  masterGain.connect(audioCtx.destination);

  recDest = audioCtx.createMediaStreamDestination();
  masterGain.connect(recDest);
}

function playTone(freq, start, dur, vol, type = 'sine') {
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type;
  o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, start);
  g.gain.linearRampToValueAtTime(vol, start + Math.min(0.4, dur * 0.3));
  g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
  o.connect(g);
  g.connect(masterGain);
  o.start(start);
  o.stop(start + dur + 0.06);
}

const CHORDS = [
  [130.81, 196.00, 261.63], // C
  [98.00, 146.83, 196.00],  // G
  [110.00, 164.81, 220.00], // Am
  [87.31, 130.81, 174.61],  // F
];

function buildMusic(startAt) {
  const chordDur = 3.0;
  const n = Math.ceil(TOTAL / chordDur);
  for (let i = 0; i < n; i++) {
    const st = startAt + i * chordDur;
    const ch = CHORDS[i % CHORDS.length];

    ch.forEach((f, j) => {
      playTone(f, st, chordDur * 1.12, 0.05, j === 0 ? 'sine' : 'triangle');
      playTone(f * 2, st, chordDur * 0.85, 0.017, 'sine');
    });

    for (let k = 0; k < 4; k++) {
      const f = ch[(k + i) % ch.length] * 4;
      playTone(f, st + k * chordDur / 4, 0.85, 0.011, 'triangle');
    }
  }
}

function boom(when, vol = 0.08) {
  if (!audioCtx) return;
  const len = Math.floor(audioCtx.sampleRate * 1.1);
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) {
    const env = Math.pow(1 - i / len, 3.2);
    d[i] = (Math.random() * 2 - 1) * env;
  }
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const flt = audioCtx.createBiquadFilter();
  flt.type = 'lowpass';
  flt.frequency.value = 850;
  const g = audioCtx.createGain();
  g.gain.value = vol;
  src.connect(flt);
  flt.connect(g);
  g.connect(masterGain);
  src.start(when);
}

/* =====================================================================
   录制与主循环
   ===================================================================== */
let recorder = null;
let chunks = [];
let playing = false;
let t0 = 0;
let rafId = 0;

const uiEl = document.getElementById('ui');
const statusEl = document.getElementById('status');
const barEl = document.getElementById('bar');
const dlEl = document.getElementById('dl');

function startRecording() {
  const stream = cvs.captureStream(30);
  recDest.stream.getAudioTracks().forEach(tr => stream.addTrack(tr));

  const types = [
    'video/webm;codecs=vp9,opus',
    'video/webm;codecs=vp8,opus',
    'video/webm',
  ];
  const mime = types.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';

  chunks = [];
  recorder = new MediaRecorder(stream, {
    mimeType: mime,
    videoBitsPerSecond: 8_000_000,
  });
  recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  recorder.onstop = () => {
    const blob = new Blob(chunks, { type: mime || 'video/webm' });
    const url = URL.createObjectURL(blob);
    dlEl.href = url;
    dlEl.download = `guoqing-${YEAR_TO}.webm`;
    dlEl.style.display = 'inline-block';
    dlEl.textContent = '⬇ 下载视频 (WebM)';
    statusEl.textContent = '录制完成 · 可点击下方按钮下载';
  };
  recorder.start();
}

function loop(now) {
  rafId = requestAnimationFrame(loop);
  if (!playing) return;

  frameDt = Math.min(0.05, (now - lastFrameTime) / 1000 || 0.016);
  lastFrameTime = now;

  const t = (now - t0) / 1000;
  if (t >= TOTAL) {
    render(TOTAL);
    barEl.style.width = '100%';
    stopAll();
    return;
  }

  render(t);
  barEl.style.width = (t / TOTAL * 100).toFixed(2) + '%';
  if (!recorder) statusEl.textContent = `播放中 ${t.toFixed(1)}s / ${TOTAL}s`;
  else statusEl.textContent = `录制中 ${t.toFixed(1)}s / ${TOTAL}s · 请勿切换标签页`;
}

function start(withRecord) {
  initAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();

  uiEl.classList.add('hide');
  dlEl.style.display = 'none';
  barEl.style.width = '0%';

  if (!constellation) constellation = buildConstellation();
  if (!buildings.length) buildCity();
  if (!noisePattern) initNoise();

  fwParticles.length = 0;
  nextFwAt = 19;

  render(0);

  if (withRecord) startRecording();

  // 音乐
  const st = audioCtx.currentTime + 0.12;
  buildMusic(st);
  masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
  masterGain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
  masterGain.gain.exponentialRampToValueAtTime(0.9, audioCtx.currentTime + 1.5);

  lastFrameTime = performance.now();
  t0 = performance.now();
  playing = true;
  if (!rafId) rafId = requestAnimationFrame(loop);
}

function stopAll() {
  playing = false;
  if (audioCtx) {
    masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
    masterGain.gain.setValueAtTime(masterGain.gain.value, audioCtx.currentTime);
    masterGain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.8);
  }
  if (recorder && recorder.state !== 'inactive') recorder.stop();
  else statusEl.textContent = '播放完成';

  setTimeout(() => {
    uiEl.classList.remove('hide');
    if (!recorder) statusEl.textContent = '';
  }, 1600);
}

/* ---------- 绑定按钮 ---------- */
document.getElementById('btnPlay').addEventListener('click', () => start(false));
document.getElementById('btnRec').addEventListener('click', () => {
  if (!window.MediaRecorder) {
    alert('当前浏览器不支持 MediaRecorder，请使用 Chrome / Edge 桌面版。');
    return;
  }
  start(true);
});

// 预渲染首帧封面
document.fonts && document.fonts.ready.then(() => {
  if (!constellation) constellation = buildConstellation();
  render(0);
});
render(0);
</script>
